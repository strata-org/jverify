name: PR build

on:
  workflow_dispatch:
  pull_request:
  merge_group:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Verification needs the `strata` CLI, which is built from source by
  # install-strata and is Linux-only (see the `compile` job for Windows).
  verify:
    name: Verify (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          path: jverify-collection
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: gradle
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: gradle

      - name: Read the pinned Strata-CLI revision
        id: strata-pin
        shell: bash
        run: |
          set -eu
          ref=$(grep -v '^#' jverify-collection/.strata-version | tr -d '[:space:]')
          if [ -z "$ref" ]; then
            echo ".strata-version contains no revision." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Install z3 on PATH
        uses: strata-org/Strata/.github/actions/install-z3@main

      # Provides both `strata` (the verifier back-end this project shells out
      # to) and `laurelJavaGen` (used by `make generate-laurel-ast` below).
      # Checked out as a sibling of jverify-collection so the build tree never
      # lands inside this repo's working tree, which would dirty the
      # git-diff check below.
      - name: Install strata on PATH
        uses: strata-org/Strata/.github/actions/install-strata@main
        with:
          ref: ${{ steps.strata-pin.outputs.ref }}
          checkout-path: strata-cli

      - name: Verify Laurel AST is up to date
        working-directory: ./jverify-collection
        run: |
          make generate-laurel-ast
          git diff --exit-code --ignore-cr-at-eol verifier/src/main/java/org/strata/jverify/laurel/

      - name: Install verifier CLI locally
        working-directory: ./jverify-collection
        run: |
          ./gradlew installDist
      - name: Publish packages locally
        working-directory: ./jverify-collection
        run: |
          ./gradlew publishToMavenLocal
      - name: Gradle test
        working-directory: ./jverify-collection
        run: |
          ./gradlew test --info

  # Windows coverage is compile-only: no Strata action supports Windows, and
  # Strata-CLI's own CI is ubuntu-only, so a Lean build there is unproven.
  # Tracked as a follow-up; see .strata-version.
  compile:
    name: Compile only (${{ matrix.os }})
    strategy:
      matrix:
        os: [ windows-2022 ]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          path: jverify-collection
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: gradle
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: gradle
      - name: Compile
        working-directory: ./jverify-collection
        run: |
          ./gradlew assemble
