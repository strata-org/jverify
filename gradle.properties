# Let Gradle's toolchain resolution also find JDKs named by these environment
# variables, for JDKs installed outside the locations Gradle auto-detects (on
# macOS, where the Brazil JDK build-tools are Linux-only and `brazil-build`
# overrides JAVA_HOME). Unset variables are ignored.
org.gradle.java.installations.fromEnv=JDK25_HOME,JDK17_HOME

# Run independent tasks of different subprojects at the same time (e.g. compilation
# across subprojects). The solver-heavy verification test tasks are the exception:
# :verifier:test and the bytecode frontend's corpusTest, examplesTest, cortexCorpusTest
# and cortexExamplesTest share `solverTestSlot` (see build.gradle.kts), so only one of
# them runs at a time even under parallel execution.
org.gradle.parallel=true
