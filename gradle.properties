# Let Gradle's toolchain resolution also find JDKs named by these environment
# variables, for JDKs installed outside the locations Gradle auto-detects (on
# macOS, where the Brazil JDK build-tools are Linux-only and `brazil-build`
# overrides JAVA_HOME). Unset variables are ignored.
org.gradle.java.installations.fromEnv=JDK25_HOME,JDK17_HOME
